- name: Establish Tailscale Connection
  shell: pwsh
  env:
    TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
  run: |
    $tailscaleExe = "${env:ProgramFiles}\Tailscale\tailscale.exe"
    if (-not (Test-Path $tailscaleExe)) {
      throw "Tailscale binary not found at $tailscaleExe"
    }

    if (-not "$env:TAILSCALE_AUTHKEY") {
      throw "TAILSCALE_AUTHKEY is missing or empty"
    }

    & $tailscaleExe up --authkey="$env:TAILSCALE_AUTHKEY" --hostname="gh-runner-$env:GITHUB_RUN_ID"
    if ($LASTEXITCODE -ne 0) {
      throw "Tailscale failed to authenticate or connect"
    }

    $tsIP = & $tailscaleExe ip -4
    if (-not $tsIP) {
      throw "Tailscale IP was not assigned"
    }

    "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV
